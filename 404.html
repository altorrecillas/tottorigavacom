<style>
  :root {
    --black: #0a0806;
    --gold: #c9a96e;
    --gold-light: #e4c98a;
    --cream: #f0e8d8;
    --cream-dim: #a89878;
  }
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--black); color: var(--cream);
    font-family: 'Montserrat', sans-serif; font-weight: 300;
    min-height: 100vh; min-height: 100svh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center; padding: 40px 24px;
    overflow-x: hidden;
  }
  body::before {
    content: ''; position: fixed; inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    opacity: .03; pointer-events: none; z-index: 1000;
  }
  .kanji {
    font-family: 'Noto Serif JP', serif; font-weight: 200;
    font-size: clamp(2rem, 7vw, 3.1rem); color: var(--gold);
    letter-spacing: .18em; opacity: .85;
  }
  .code {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(4.5rem, 20vw, 9rem); line-height: 1;
    color: var(--gold); margin: 18px 0 6px;
  }
  h1 {
    font-family: 'Cormorant Garamond', serif; font-weight: 300;
    font-size: clamp(1.4rem, 5vw, 2.1rem); color: var(--cream);
    margin-bottom: 18px;
  }
  h1 em { font-style: italic; color: var(--gold-light); }
  p { color: var(--cream-dim); font-size: 14px; line-height: 1.9; max-width: 42ch; margin: 0 auto 38px; }
  .enlaces { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; }
  .enlaces a {
    font-size: 10.5px; letter-spacing: .25em; text-transform: uppercase;
    text-decoration: none; padding: 16px 32px;
    border: 1px solid var(--gold); color: var(--gold);
    transition: background .3s, color .3s;
  }
  .enlaces a.primario { background: var(--gold); color: var(--black); }
  .enlaces a:hover { background: var(--gold-light); border-color: var(--gold-light); color: var(--black); }
  .regla { width: 56px; height: 1px; background: var(--gold); opacity: .5; margin: 0 auto 30px; }
</style>
